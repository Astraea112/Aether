<!DOCTYPE html>
<html lang="zh"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>白梅开场</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital@1&display=swap" rel="stylesheet">
<style>
html,body{margin:0;height:100%;background:#1a1a1d;overflow:hidden}
.home{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;color:#ddd;
  font:italic 34px "Cormorant Garamond",serif;background:linear-gradient(#2a2a2e,#151517)}
#intro{position:fixed;inset:0;background:#0e0e10;z-index:5;overflow:hidden}
#intro::before{content:"";position:absolute;inset:0;pointer-events:none;z-index:2;
  background:radial-gradient(120% 90% at 50% 40%,transparent 55%,rgba(0,0,0,.55))}
.art{position:absolute;right:-15.5vw;top:9vh;width:min(calc(100vw * 1414/880),860px);aspect-ratio:1414/758}
.art img{position:absolute;display:block}
.br{left:0;top:0;width:100%;opacity:0;filter:blur(2px)}
.go .br{animation:rise 1.4s ease-out forwards}
@keyframes rise{to{opacity:1;filter:none}}
.fl{opacity:0;transform:scale(.6);filter:blur(1.5px)}
.go .fl{animation:bloom 1s cubic-bezier(.2,.8,.3,1) var(--d) forwards}
@keyframes bloom{to{opacity:1;transform:none;filter:none}}
#word{position:fixed;left:0;right:0;top:53vh;text-align:center;z-index:8;color:#f2efe8;font:italic 46px "Cormorant Garamond",serif;text-shadow:0 0 6px rgba(0,0,0,.8);letter-spacing:.04em;opacity:0;filter:blur(3px);pointer-events:none}
#fall{position:fixed;inset:0;pointer-events:none;z-index:7}
.pt{position:absolute;left:0;top:0;pointer-events:none;transform-origin:50% 30%}
.hint{position:fixed;bottom:18px;left:0;right:0;text-align:center;color:#777;font:12px sans-serif;z-index:9}
</style></head><body>
<div class="home"></div>
<div id="intro"><div class="art" id="art">
<img class="br" src="full.png">
</div></div>
<div id="word">Home</div>
<div id="fall"></div>
<div class="hint">点屏幕进主页，进去后再点一下重放</div>
<script>
const intro=document.getElementById("intro"), art=document.getElementById("art");
let timers=[];
function at(px,py){const r=art.getBoundingClientRect(); return [r.left+r.width*px/1414, r.top+r.height*py/758, r.width/1414];}
// 花瓣:从树上那朵花的位置松开,照着荡秋千的路线落下
function petal(src,sx,sy,delay,drift,A,C,ph,rot0){
  timers.push(setTimeout(()=>{
    const [x0,y0,sc]=at(sx,sy), w=37*sc;
    const el=document.createElement("img"); el.className="pt"; el.src=src; el.style.width=w+"px";
    document.getElementById("fall").appendChild(el);
    const swings=Math.ceil((innerHeight-y0)/drift)+1, k=[], N=swings*40;
    for(let i=0;i<=N;i++){ const f=i/N, sP=f*swings, c=Math.cos(Math.PI*sP), sn=Math.sin(Math.PI*sP), e=Math.min(1,sP/1.2+.15);
      const x=x0-w/2-ph*A*(1-c)*e, y=y0-w/2+drift*sP+C*sn*sn*e;
      k.push({transform:`translate(${x}px,${y}px) rotate(${rot0*(1-e)+ph*sn*42*e}deg) rotateX(${(1-Math.abs(sn))*45*e}deg) `,
              opacity: f<.03? f/.03 : (f>.88? (1-f)/.12 : 1)}); }
    el.animate(k,{duration:swings*1650,easing:"linear",fill:"forwards"});
  },delay));
}
let shown=false, loop=0;
function leave(){
  if(!shown) return; shown=false; clearInterval(loop);
  const word=document.getElementById("word");
  [intro,word].forEach(e=>e.animate([{opacity:getComputedStyle(e).opacity},{opacity:0}],{duration:900,easing:"ease",fill:"forwards"}));
  intro.style.pointerEvents="none";
}
function play(){
  clearInterval(loop);
  timers.forEach(clearTimeout); timers=[];
  intro.getAnimations().forEach(a=>a.cancel());
  document.querySelectorAll(".pt").forEach(e=>e.remove());
  art.classList.remove("go"); void art.offsetWidth; art.classList.add("go");
  petal("petal1.png",955,470,1800,74,96,34,1,-10);
  petal("petal0.png",930,420,2300,70,88,30,-1,-45);
  petal("petal2.png",975,330,2800,78,82,36,1,30);
  const word=document.getElementById("word"); word.getAnimations().forEach(a=>a.cancel());
  word.animate([{opacity:0,filter:"blur(3px)",transform:"translateY(6px)"},{opacity:1,filter:"none",transform:"none"}],{duration:1400,delay:2300,easing:"ease-out",fill:"forwards"});
  intro.style.pointerEvents=""; shown=true;
  // 等着的时候,隔一阵再落一片
  let n=0; const P=[["petal1.png",955,470],["petal0.png",930,420],["petal2.png",975,330]];
  loop=setInterval(()=>{ const [src,x,y]=P[n%3]; n++; petal(src,x,y,0,74,80+Math.random()*25,30+Math.random()*8,Math.random()<.5?1:-1,(Math.random()-.5)*60); },4200);
}
document.addEventListener("click",()=>shown?leave():play());
addEventListener("load",play);
</script></body></html>
