# Ombre Brain on OAO — based on the official deploy/docker-compose.user.yml (3.6.14), with:
#   - image pinned to a known version (re-runs pull the same thing)
#   - a fixed bridge subnet, so the address nginx arrives from (via docker-proxy) is known
#     and can be listed exactly in OMBRE_TRUSTED_PROXY_CIDRS
#   - host port bound to loopback only; nginx on the host is the only way in
#   - a memory ceiling, since the box has 2 GB shared with the relay and Claude Code
# Secrets and per-host values live in the .env next to this file (never in git).
name: ombre-brain

services:
  ombre-brain:
    image: p0luz/ombre-brain:${OMBRE_IMAGE_TAG:-3.6.14}
    container_name: ombre-brain
    restart: unless-stopped
    ports:
      - "127.0.0.1:${OMBRE_HOST_PORT:-18001}:8000"
    mem_limit: ${OMBRE_MEM_LIMIT:-768m}
    environment:
      - OMBRE_TRANSPORT=streamable-http
      - OMBRE_BIND_ADDRESS=127.0.0.1
      - OMBRE_ALLOW_INSECURE_MCP=false
      - OMBRE_MCP_AUTH_MODE=${OMBRE_MCP_AUTH_MODE:-hybrid}
      - OMBRE_MCP_TOKEN=${OMBRE_MCP_TOKEN:-}
      - OMBRE_CONFIG_PATH=/app/buckets/config.yaml
      - OMBRE_COMPRESS_API_KEY=${OMBRE_COMPRESS_API_KEY:-}
      - OMBRE_COMPRESS_BASE_URL=${OMBRE_COMPRESS_BASE_URL:-}
      - OMBRE_COMPRESS_MODEL=${OMBRE_COMPRESS_MODEL:-}
      - OMBRE_EMBED_BACKEND=api
      - OMBRE_EMBED_API_KEY=${OMBRE_EMBED_API_KEY:-}
      - OMBRE_EMBED_BASE_URL=${OMBRE_EMBED_BASE_URL:-}
      - OMBRE_EMBED_MODEL=${OMBRE_EMBED_MODEL:-}
      - OMBRE_DASHBOARD_PASSWORD=${OMBRE_DASHBOARD_PASSWORD:?OMBRE_DASHBOARD_PASSWORD is required}
      - AI_NAME=${AI_NAME:-}
      - "OMBRE_TRUSTED_PROXY_CIDRS=${OMBRE_TRUSTED_PROXY_CIDRS:-127.0.0.0/8,::1/128}"
      - OMBRE_HOST_VAULT_DIR=${OMBRE_HOST_VAULT_DIR:-}
    volumes:
      - type: bind
        source: ${OMBRE_HOST_VAULT_DIR:?OMBRE_HOST_VAULT_DIR is required}
        target: /app/buckets
    networks:
      - ombre

networks:
  ombre:
    ipam:
      config:
        - subnet: ${OMBRE_NET_SUBNET:-172.30.18.0/24}
          gateway: ${OMBRE_NET_GATEWAY:-172.30.18.1}
